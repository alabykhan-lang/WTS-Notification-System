name: Validate Notification System
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application
        run: |
          test -s index.html
          test -s styles.css
          test -s config.js
          test -s api.js
          test -s app.js
          test -s bulk.js
          test -s identity-login.js
          test -s whatsapp.html
          test -s whatsapp.js
          test -s api/_meta.js
          test -s api/meta-setup.js
          test -s api/meta-dispatch.js
          test -s api/meta-webhook.js
          test -s manifest.webmanifest
          test -s vercel.json
          node --check config.js
          node --check api.js
          node --check app.js
          node --check bulk.js
          node --check identity-login.js
          node --check whatsapp.js
          node --check api/_meta.js
          node --check api/meta-setup.js
          node --check api/meta-dispatch.js
          node --check api/meta-webhook.js
          node --check api/_bahasha.js
          node --check api/bahasha-status.js
          node --check api/bahasha-dispatch.js
          node --check api/bahasha-contacts-sync.js
          node --check api/bahasha-webhook.js
          grep -q 'Open Notifications' index.html
          grep -q 'class="locked"' index.html
          grep -q 'school_notification_control_read_api' api.js
          grep -q 'school_notification_template_send_api' api.js
          grep -q 'school_notification_message_admin_write_api' api.js
          grep -q 'API.templateSend' bulk.js
          grep -q '/api/bahasha-dispatch' bulk.js
          grep -q 'Choose a message template' index.html
          grep -q 'All ready parents in this class' index.html
          grep -q 'Delivery reports' index.html
          grep -q 'school_meta_whatsapp_status_api' api/bahasha-status.js
          grep -q 'school_meta_whatsapp_claim_api' api/bahasha-dispatch.js
          grep -q 'school_meta_whatsapp_complete_api' api/bahasha-dispatch.js
          grep -q 'WhatsApp Delivery Setup' whatsapp.html
          grep -q 'school_meta_whatsapp_configure_api' api/meta-setup.js
          if grep -q 'public-live.js' index.html; then echo 'Public live loader must not be used'; exit 1; fi
          if git grep -n -E 'SUPABASE_SERVICE_ROLE_KEY|service_role_key|sb_secret_|WTS_WHATSAPP_GATEWAY_TOKEN|EA[A-Za-z0-9]{80,}' -- . ':(exclude).github/workflows/validate.yml'; then exit 1; fi
      - name: Run tests
        run: npm test
